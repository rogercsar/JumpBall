[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirecionamento para Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirecionamento SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de Segurança e Permissões de Hardware Mobile
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Garante que a câmera, acelerômetro e giroscópio funcionem perfeitamente no domínio
    Permissions-Policy = "camera=(self), accelerometer=(self), gyroscope=(self)"
